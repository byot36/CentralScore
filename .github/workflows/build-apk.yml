name: Build CentralScore Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install web app dependencies
        working-directory: app
        run: npm ci

      - name: Build web assets
        working-directory: app
        run: npm run build
        env:
          VITE_APP_VERSION: 1.0.${{ github.run_number }}

      - name: Sync Capacitor
        working-directory: app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: centralscore-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK for release
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk CentralScore.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CentralScore v1.0.${{ github.run_number }}
          files: CentralScore.apk
          generate_release_notes: true
